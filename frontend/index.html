<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter Admin — Frontend</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='44'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ================= LOGIN VIEW ================= -->
  <div id="view-login" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🐾</div>
      <h1>Shelter Admin</h1>
      <p class="login-sub">Admin panel for the NestJS + MySQL backend</p>

      <label class="field-label">API URL</label>
      <input id="login-api" type="text" value="https://kylebackend.onrender.com" spellcheck="false">

      <label class="field-label">Username</label>
      <input id="login-user" type="text" autocomplete="username">

      <label class="field-label">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password">

      <button id="btn-login" class="btn primary block">Log in</button>
      <button id="btn-register" class="btn ghost block">Register new account</button>
      <button id="btn-test" class="btn quiet block">Test connection</button>

      <p id="login-msg" class="login-msg"></p>
    </div>
  </div>

  <!-- ================= APP VIEW ================= -->
  <div id="view-app" class="app" hidden>

    <header class="topbar">
      <span class="topbar-brand">🐾 Shelter Admin</span>
      <span id="topbar-api" class="topbar-api" title="API URL — click to change"></span>
      <span class="spacer"></span>
      <i id="topbar-avatar" class="avatar" aria-hidden="true"></i>
      <span id="topbar-user" class="topbar-user"></span>
      <button id="btn-logout" class="btn ghost sm">Log out</button>
    </header>

    <div class="layout">
      <nav id="sidebar" class="sidebar"><!-- tabs generated by app.js --></nav>

      <main class="content">
        <div class="panel toolrow">
          <h2 id="res-title" class="res-title">—</h2>
          <span class="spacer"></span>
          <input id="search" type="search" placeholder="Search…" class="search">
          <button id="btn-reload" class="btn sm">Reload</button>
          <button id="btn-add" class="btn primary sm">+ Add new</button>
        </div>

        <div class="grid-2" id="work-grid">
          <section class="panel">
            <div id="table-wrap" class="table-wrap"><p class="muted pad">Choose a tab on the left, or press reload.</p></div>
          </section>

          <section class="panel" id="form-panel" hidden>
            <h3 id="form-title" class="form-title">Add record</h3>
            <form id="form"></form>
            <div class="form-actions">
              <button id="btn-save" class="btn primary">Save</button>
              <button id="btn-cancel" class="btn ghost">Cancel</button>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
